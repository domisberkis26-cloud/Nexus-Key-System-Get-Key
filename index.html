
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS Key Generator</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background:
        radial-gradient(circle at top, #32145b 0%, transparent 45%),
        #08060f;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    width: 100%;
    max-width: 420px;
    padding: 30px 24px;
    background: rgba(20, 14, 34, 0.96);
    border: 1px solid #6736a5;
    border-radius: 18px;
    box-shadow: 0 0 40px rgba(130, 55, 220, 0.2);
    text-align: center;
}

.logo {
    color: #bd83ff;
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 5px;
}

.subtitle {
    margin-top: 8px;
    color: #a99ab9;
    font-size: 13px;
}

.line {
    height: 1px;
    background: #38234e;
    margin: 25px 0;
}

h2 {
    font-size: 19px;
    margin-bottom: 10px;
}

.description {
    color: #a99ab9;
    font-size: 13px;
    line-height: 1.5;
}

.key-box {
    display: none;
    margin-top: 24px;
    padding: 15px;
    background: #0c0913;
    border: 1px solid #7441b4;
    border-radius: 10px;
}

.key-label {
    color: #a99ab9;
    font-size: 11px;
    margin-bottom: 10px;
    letter-spacing: 2px;
}

#keyOutput {
    color: #d5adff;
    font-size: 19px;
    font-weight: bold;
    overflow-wrap: anywhere;
    letter-spacing: 1px;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 9px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:active {
    transform: scale(0.97);
}

.generate {
    margin-top: 25px;
    color: white;
    background: linear-gradient(100deg, #7133c7, #a34be9);
}

.generate:hover {
    filter: brightness(1.15);
}

.copy {
    margin-top: 12px;
    color: white;
    background: #292039;
    border: 1px solid #7045a5;
}

.copy:hover {
    background: #392650;
}

.status {
    min-height: 18px;
    margin-top: 13px;
    color: #b88bea;
    font-size: 12px;
}

.footer {
    margin-top: 25px;
    color: #71647f;
    font-size: 11px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">NEXUS</div>
    <div class="subtitle">KEY GENERATOR</div>

    <div class="line"></div>

    <h2>Generate your key</h2>
    <p class="description">
        Press the button below to generate your personal NEXUS key.
    </p>

    <div class="key-box" id="keyBox">
        <div class="key-label">YOUR GENERATED KEY</div>
        <div id="keyOutput"></div>
        <button class="copy" onclick="copyKey()">COPY KEY</button>
    </div>

    <button class="generate" onclick="generateKey()">
        GENERATE KEY
    </button>

    <div class="status" id="status"></div>

    <div class="footer">
        NEXUS SYSTEM
    </div>

</div>

<script>
let currentKey = "";

function randomCharacters(length) {
    const characters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    const values = new Uint8Array(length);

    if (window.crypto && window.crypto.getRandomValues) {
        window.crypto.getRandomValues(values);
    } else {
        for (let i = 0; i < length; i++) {
            values[i] = Math.floor(Math.random() * 256);
        }
    }

    return Array.from(values, value =>
        characters[value % characters.length]
    ).join("");
}

function generateKey() {
    currentKey = "NEXUS-" + randomCharacters(8);

    document.getElementById("keyOutput").textContent = currentKey;
    document.getElementById("keyBox").style.display = "block";
    document.getElementById("status").textContent = "Key generated successfully!";
}

async function copyKey() {
    if (!currentKey) return;

    try {
        await navigator.clipboard.writeText(currentKey);
        document.getElementById("status").textContent = "Key copied!";
    } catch (error) {
        const textArea = document.createElement("textarea");
        textArea.value = currentKey;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand("copy");
        textArea.remove();

        document.getElementById("status").textContent = "Key copied!";
    }
}
</script>

</body>
</html>
