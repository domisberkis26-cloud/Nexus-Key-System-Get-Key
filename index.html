
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS Key System</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #090a12;
    font-family: Arial, sans-serif;
    color: white;
    padding: 18px;
}

.container {
    width: 100%;
    max-width: 390px;
    background: #111321;
    border: 1px solid #7655ed;
    border-radius: 16px;
    padding: 27px 22px;
    box-shadow: 0 0 35px #7655ed25;
}

.logo {
    text-align: center;
    font-size: 29px;
    font-weight: 900;
    letter-spacing: 8px;
    color: #a58aff;
}

.subtitle {
    text-align: center;
    color: #85869e;
    font-size: 10px;
    letter-spacing: 2px;
    margin: 9px 0 28px;
}

input {
    width: 100%;
    padding: 15px;
    border: 1px solid #30334b;
    border-radius: 8px;
    outline: none;
    background: #1b1d30;
    color: white;
    font-size: 14px;
}

input:focus {
    border-color: #9675ff;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 14px;
}

button {
    flex: 1;
    padding: 14px 8px;
    border: none;
    border-radius: 8px;
    background: #7655ed;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    background: #9277ff;
    transform: translateY(-2px);
}

button:disabled {
    opacity: .5;
    cursor: wait;
    transform: none;
}

.status {
    margin-top: 22px;
    min-height: 35px;
    color: #aaaac1;
    font-size: 12px;
    overflow-wrap: anywhere;
}

.status.success { color: #69f5a2; }
.status.error { color: #ff7373; }
.status.loading { color: #ffd36b; }

.footer {
    margin-top: 20px;
    text-align: center;
    font-size: 9px;
    color: #666780;
    letter-spacing: 2px;
}

.loader {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid #ffffff40;
    border-top-color: white;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: middle;
    margin-right: 7px;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>
</head>

<body>

<div class="container">
    <div class="logo">NEXUS</div>
    <div class="subtitle">PLATOBOOST AUTHENTICATION</div>

    <input
        id="keyInput"
        type="text"
        placeholder="Enter your key..."
        autocomplete="off"
    >

    <div class="buttons">
        <button id="getKey">GET KEY</button>
        <button id="verifyKey">VERIFY KEY</button>
    </div>

    <div id="status" class="status">
        ● Waiting for authentication
    </div>

    <div class="footer">
        NEXUS • SECURE ACCESS
    </div>
</div>

<script>
const CONFIG = {
    serviceId: "36392",
    apiHosts: [
        "https://api.platoboost.com",
        "https://api.platoboost.net"
    ]
};

const statusElement = document.getElementById("status");
const keyInput = document.getElementById("keyInput");
const getButton = document.getElementById("getKey");
const verifyButton = document.getElementById("verifyKey");

let identifier = localStorage.getItem("nexus_identifier");

if (!identifier) {
    identifier = crypto.randomUUID();
    localStorage.setItem("nexus_identifier", identifier);
}

let cachedLink = "";
let cachedAt = 0;
let busy = false;

function setStatus(message, type = "") {
    statusElement.className = "status " + type;
    statusElement.textContent = "● " + message;
}

function setLoading(message) {
    statusElement.className = "status loading";
    statusElement.innerHTML =
        '<span class="loader"></span>' + message;
}

async function apiRequest(method, endpoint, body) {
    let lastError = "Unable to connect to Platoboost.";

    for (const host of CONFIG.apiHosts) {
        try {
            const response = await fetch(host + endpoint, {
                method,
                headers: {
                    "Content-Type": "application/json"
                },
                body: body ? JSON.stringify(body) : undefined
            });

            const result = await response.json();

            if (!response.ok) {
                lastError =
                    result.message || "HTTP " + response.status;
                continue;
            }

            return result;

        } catch (error) {
            lastError = error.message;
        }
    }

    throw new Error(lastError);
}

async function generateLink() {
    if (cachedLink && Date.now() - cachedAt < 600000) {
        return cachedLink;
    }

    const response = await apiRequest(
        "POST",
        "/public/start",
        {
            service: CONFIG.serviceId,
            identifier
        }
    );

    if (response.success !== true || !response.data?.url) {
        throw new Error(
            response.message || "Checkpoint URL was not returned."
        );
    }

    cachedLink = response.data.url;
    cachedAt = Date.now();

    return cachedLink;
}

async function copyText(text) {
    try {
        await navigator.clipboard.writeText(text);
        return true;
    } catch {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();

        const copied = document.execCommand("copy");
        textarea.remove();

        return copied;
    }
}

getButton.addEventListener("click", async () => {
    if (busy) return;

    busy = true;
    getButton.disabled = true;

    setLoading("Generating checkpoint...");

    try {
        const link = await generateLink();
        const copied = await copyText(link);

        if (copied) {
            setStatus(
                "Checkpoint link copied successfully!",
                "success"
            );
        } else {
            setStatus(
                "Copy unavailable. Open this link: " + link,
                "error"
            );
        }
    } catch (error) {
        setStatus("API error: " + error.message, "error");
    }

    busy = false;
    getButton.disabled = false;
});

verifyButton.addEventListener("click", async () => {
    if (busy) return;

    const key = keyInput.value.trim();

    if (!key) {
        setStatus("Please enter your key.", "error");
        return;
    }

    busy = true;
    verifyButton.disabled = true;

    setLoading("Verifying key...");

    try {
        const params = new URLSearchParams({
            identifier,
            key,
            nonce: "true"
        });

        const response = await apiRequest(
            "GET",
            "/public/whitelist/" +
            CONFIG.serviceId + "?" + params
        );

        if (response.success !== true) {
            throw new Error(
                response.message || "Key verification failed."
            );
        }

        const data = response.data || {};

        if (data.valid !== true && data.whitelisted !== true) {
            throw new Error(data.message || "Key is not valid.");
        }

        setStatus(
            "Key accepted! Authentication successful.",
            "success"
        );

    } catch (error) {
        setStatus(error.message, "error");
    }

    busy = false;
    verifyButton.disabled = false;
});
</script>

</body>
</html>
